name: Import full v72 pose trace events

on:
  push:
    branches: [akira-native-row0-experiment]
    paths:
      - ".github/workflows/import-pose-trace-v72-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the committed v72 trace from main
        uses: actions/checkout@v4
        with:
          repository: cdmn1/vf3-naomi
          ref: main
          path: trace-source
          fetch-depth: 1

      - name: Check out the pose watch profile from the experiment branch
        uses: actions/checkout@v4
        with:
          repository: cdmn1/vf3-naomi
          ref: akira-native-row0-experiment
          path: trace-tools
          fetch-depth: 1

      - name: Install 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract original v72 trace
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="trace-source/VF3-Flycast-Trace/vf3-pose-capture-tool-v72/vf3-pose-trace.7z"
          test -s "$ARCHIVE"
          mkdir -p trace-extracted
          7z x -y -otrace-extracted "$ARCHIVE"
          TRACE="$(find trace-extracted -type f -name '*.bin' -print -quit)"
          test -n "$TRACE"
          test -s "$TRACE"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"
          stat -c 'Extracted trace bytes: %s' "$TRACE"
          sha256sum "$TRACE" | tee trace-sha256.txt

      - name: Decode full pose memory and PC event streams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, gzip, mmap, re, struct
          from collections import Counter, defaultdict
          from pathlib import Path

          trace = Path(__import__("os").environ["TRACE"])
          watch = Path("trace-tools/tools/VF3_WATCH_POSE_FULL.txt")
          out = Path("pose-v72-full-events")
          out.mkdir(exist_ok=True)

          ranges = []
          for line in watch.read_text(encoding="utf-8").splitlines():
              m = re.match(r"\s*mem\s+(0x[0-9a-fA-F]+)\s+(0x[0-9a-fA-F]+)", line)
              if m:
                  start, size = (int(m.group(1), 16), int(m.group(2), 16))
                  ranges.append((start, start + size))
          if not ranges:
              raise SystemExit("No memory ranges parsed from VF3_WATCH_POSE_FULL.txt")

          pc_counts = Counter()
          mem_counts = Counter()
          range_counts = Counter()
          records = Counter()
          unknown_words = 0
          malformed = 0
          event_index = 0
          word_index = 0
          trace_bytes = trace.stat().st_size
          if trace_bytes % 8:
              raise SystemExit(f"Trace byte length {trace_bytes} is not divisible by 8")

          with trace.open("rb") as raw, \
               gzip.open(out / "memory_accesses.csv.gz", "wt", newline="", encoding="utf-8") as mf, \
               gzip.open(out / "pc_snapshots.csv.gz", "wt", newline="", encoding="utf-8") as pf:
              mw = csv.writer(mf)
              pw = csv.writer(pf)
              mw.writerow(["event_index","word_index","pc","access","width","address","value"])
              pw.writerow(["event_index","word_index","pc","pr"] + [f"r{i}" for i in range(16)])

              with mmap.mmap(raw.fileno(), 0, access=mmap.ACCESS_READ) as mm:
                  words = memoryview(mm).cast("Q")
                  n = len(words)
                  i = 0
                  while i < n:
                      word = words[i]
                      marker = word & 0xFFFF

                      if marker == 0xFA12:
                          pc = (word >> 16) & 0xFFFFFFFF
                          if i + 18 < n and (words[i+18] & 0xFFFF) == 0xFA13 and ((words[i+18] >> 16) & 0xFFFFFFFF) == pc:
                              pr = words[i+1] & 0xFFFFFFFF
                              regs = [words[i+2+j] & 0xFFFFFFFF for j in range(16)]
                              pw.writerow([event_index, i, f"0x{pc:08X}", f"0x{pr:08X}"] + [f"0x{x:08X}" for x in regs])
                              pc_counts[pc] += 1
                              records["FA12"] += 1
                              event_index += 1
                              i += 19
                              continue
                          malformed += 1
                          i += 1
                          continue

                      if marker == 0xFA10:
                          pc = (word >> 16) & 0xFFFFFFFF
                          if i + 7 < n and (words[i+7] & 0xFFFF) == 0xFA11 and ((words[i+7] >> 16) & 0xFFFFFFFF) == pc:
                              regs = [words[i+j] & 0xFFFFFFFF for j in range(1,7)]
                              pw.writerow([event_index, i, f"0x{pc:08X}", ""] +
                                          [f"0x{x:08X}" for x in ([0]*9 + regs)])
                              pc_counts[pc] += 1
                              records["FA10"] += 1
                              event_index += 1
                              i += 8
                              continue
                          malformed += 1
                          i += 1
                          continue

                      if marker == 0xFA20:
                          if i + 3 >= n:
                              malformed += 1
                              break
                          pc = (word >> 16) & 0xFFFFFFFF
                          meta, address, value = words[i+1], words[i+2], words[i+3]
                          width = (meta >> 48) & 0xFFFF
                          is_write = (meta >> 47) & 1
                          if any(start <= address < end for start, end in ranges):
                              access = "W" if is_write else "R"
                              rendered = f"0x{value:016X}" if width == 8 else f"0x{value & 0xFFFFFFFF:08X}"
                              mw.writerow([event_index, i, f"0x{pc:08X}", access, width, f"0x{address:08X}", rendered])
                              mem_counts[(access, width, pc)] += 1
                              for start, end in ranges:
                                  if start <= address < end:
                                      range_counts[(start, end, access)] += 1
                                      break
                          records["FA20"] += 1
                          event_index += 1
                          i += 4
                          continue

                      if marker == 0xFA21:
                          if i + 5 >= n:
                              malformed += 1
                              break
                          records["FA21"] += 1
                          event_index += 1
                          i += 6
                          continue

                      if marker == 0xFA22:
                          if i + 8 >= n:
                              malformed += 1
                              break
                          records["FA22"] += 1
                          event_index += 1
                          i += 9
                          continue

                      unknown_words += 1
                      i += 1

                  words.release()

          summary = []
          summary += ["# Full v72 pose-trace decode", ""]
          summary += [f"- Trace: `{trace.name}`", f"- Trace bytes: {trace_bytes:,}", f"- Decoded record events: {event_index:,}", f"- Malformed records: {malformed:,}", f"- Unknown/unconsumed words: {unknown_words:,}", ""]
          summary += ["## Record counts", ""]
          for key in ["FA10","FA12","FA20","FA21","FA22"]:
              summary.append(f"- {key}: {records[key]:,}")
          summary += ["", "## PC snapshot counts", ""]
          for pc,count in pc_counts.most_common():
              summary.append(f"- `0x{pc:08X}`: {count:,}")
          summary += ["", "## Memory access counts by watch range", ""]
          for (start,end,access),count in sorted(range_counts.items()):
              summary.append(f"- `0x{start:08X}..0x{end:08X}` {access}: {count:,}")
          summary += ["", "## Top memory writer PCs", ""]
          writers = Counter()
          for (access,width,pc),count in mem_counts.items():
              if access == "W":
                  writers[pc] += count
          for pc,count in writers.most_common(40):
              summary.append(f"- `0x{pc:08X}`: {count:,}")
          (out / "REPORT.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          (out / "DECODE_COUNTS.txt").write_text(
              f"events={event_index}\nmalformed={malformed}\nunknown_words={unknown_words}\n"
              + "".join(f"{k}={records[k]}\n" for k in ["FA10","FA12","FA20","FA21","FA22"]),
              encoding="utf-8")
          if malformed or unknown_words:
              raise SystemExit("Trace decode did not consume every record cleanly; see REPORT.md")
          print("\n".join(summary[:80]))
          PY

      - name: Upload complete pose trace events
        uses: actions/upload-artifact@v4
        with:
          name: vf3-pose-trace-v72-full-events
          path: |
            pose-v72-full-events/
            trace-sha256.txt
          if-no-files-found: error
          retention-days: 14
