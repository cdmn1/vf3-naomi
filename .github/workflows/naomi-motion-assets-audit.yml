name: Audit VF3 Naomi motion assets

on:
  push:
    branches: [main]
    paths:
      - "tools/inspect_naomi_motion_assets.py"
      - ".github/workflows/naomi-motion-assets-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out VF3 Naomi
        uses: actions/checkout@v4

      - name: Download MOTHEAD.BIN
        run: |
          set -euo pipefail
          mkdir -p motion-assets
          curl --fail --location --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/cdmn1/vf3-naomi-assets/assets/MOTHEAD.BIN \
            --output motion-assets/MOTHEAD.BIN

      - name: Download MTJACLAU.BIN
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/cdmn1/vf3-naomi-assets/assets/MTJACLAU.BIN \
            --output motion-assets/MTJACLAU.BIN

      - name: Verify manifest identity and inspect records
        run: python3 tools/inspect_naomi_motion_assets.py motion-assets

      - name: Publish text audit only
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-motion-asset-audit
          path: motion-assets/MOTION_ASSET_AUDIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Add audit to job summary
        if: always()
        run: |
          if [ -f motion-assets/MOTION_ASSET_AUDIT.txt ]; then
            cat motion-assets/MOTION_ASSET_AUDIT.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Asset download or inspection failed; see step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
