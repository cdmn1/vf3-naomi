name: Test VF3 trace and SH-4 analysis tools

on:
  push:
    branches: [main]
    paths:
      - "tools/loader_trace_*.py"
      - "tools/sh4_string_xrefs.py"
      - "tools/validate_gdfs_asset_index.py"
      - "tests/test_loader_trace_*.py"
      - "tests/test_sh4_string_xrefs.py"
      - "tests/test_gdfs_asset_index.py"
      - "tests/test_naomi_test_rom_packer.py"
      - ".github/workflows/trace-analysis-tests.yml"
  pull_request:
    paths:
      - "tools/loader_trace_*.py"
      - "tools/sh4_string_xrefs.py"
      - "tests/test_loader_trace_*.py"
      - "tests/test_sh4_string_xrefs.py"
      - "tests/test_gdfs_asset_index.py"
      - "tests/test_naomi_test_rom_packer.py"
      - ".github/workflows/trace-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trace, asset-index and Naomi ROM packer tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
