name: Test VF3 trace analysis tools

on:
  push:
    branches: [main]
    paths:
      - "tools/loader_trace_*.py"
      - "tests/test_loader_trace_*.py"
      - ".github/workflows/trace-analysis-tests.yml"
  pull_request:
    paths:
      - "tools/loader_trace_*.py"
      - "tests/test_loader_trace_*.py"
      - ".github/workflows/trace-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trace decoder and summary tests
        run: python -m unittest discover -s tests -p "test_loader_trace_*.py" -v
