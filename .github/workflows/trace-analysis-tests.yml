name: Test VF3 trace and SH-4 analysis tools

on:
  push:
    branches: [main]
    paths:
      - "tools/loader_trace_*.py"
      - "tools/sh4_string_xrefs.py"
      - "tools/validate_gdfs_asset_index.py"
      - "tests/test_loader_trace_*.py"
      - "tests/test_sh4_string_xrefs.py"
      - "tests/test_gdfs_asset_index.py"
      - "tests/test_naomi_test_rom_packer.py"
      - ".github/workflows/trace-analysis-tests.yml"
  pull_request:
    paths:
      - "tools/loader_trace_*.py"
      - "tools/sh4_string_xrefs.py"
      - "tests/test_loader_trace_*.py"
      - "tests/test_sh4_string_xrefs.py"
      - "tests/test_gdfs_asset_index.py"
      - "tests/test_naomi_test_rom_packer.py"
      - ".github/workflows/trace-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trace, asset-index and Naomi ROM packer tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  latest-input-capture-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base64-export and decode latest repository capture
        shell: bash
        run: |
          TRACE="VF3-Flycast-Trace 202611181953/vf3-loader-trace.bin"
          base64 -w 0 "$TRACE" > vf3-loader-trace.bin.b64
          base64 -d vf3-loader-trace.bin.b64 > vf3-loader-trace.roundtrip.bin
          cmp "$TRACE" vf3-loader-trace.roundtrip.bin
          sha256sum "$TRACE" vf3-loader-trace.roundtrip.bin
          python tools/loader_trace_input_report.py "$TRACE" --output input-field-report.md
          cat input-field-report.md >> "$GITHUB_STEP_SUMMARY"
          cat input-field-report.md
      - name: Upload base64 trace and decoded report
        uses: actions/upload-artifact@v4
        with:
          name: vf3-input-capture-base64-202611181953
          path: |
            vf3-loader-trace.bin.b64
            input-field-report.md
          if-no-files-found: error
          retention-days: 30
