name: Analyze Naomi test-mode exit reference ROM

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and disassemble the test executable
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-sh4-linux-gnu
          python3 - <<'PY'
          import base64, io, pathlib, re, struct, subprocess, zipfile

          encoded = pathlib.Path("encoded-20261116145552.txt").read_text()
          archive = base64.b64decode("".join(encoded.split()))
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              names = [n for n in zf.namelist() if n.lower().endswith(".bin")]
              if len(names) != 1:
                  raise SystemExit(f"expected one BIN in reference ZIP, got {names}")
              rom = zf.read(names[0])

          def triple(offset):
              return struct.unpack_from("<III", rom, offset)

          main_off, main_addr, main_size = triple(0x360)
          test_off, test_addr, test_size = triple(0x3C0)
          main_entry, test_entry = struct.unpack_from("<II", rom, 0x420)

          print("REFERENCE ROM:", names[0])
          print("ROM bytes:", len(rom))
          print("Main descriptor:", hex(main_off), hex(main_addr), hex(main_size))
          print("Test descriptor:", hex(test_off), hex(test_addr), hex(test_size))
          print("Main entry:", hex(main_entry), "Test entry:", hex(test_entry))
          print("Header identity:", rom[:0x30].decode("ascii", "replace").rstrip())

          def inspect_segment(label, file_off, load_addr, size, entry):
              segment = rom[file_off:file_off + size]
              needle = bytes.fromhex("00 80 01 ac")
              literals = []
              pos = 0
              while True:
                  pos = segment.find(needle, pos)
                  if pos < 0:
                      break
                  literals.append(pos)
                  pos += 1

              path = pathlib.Path(f"/tmp/{label}.bin")
              path.write_bytes(segment)
              proc = subprocess.run(
                  ["sh4-linux-gnu-objdump", "-D", "-b", "binary", "-m", "sh4", "-EL",
                   f"--adjust-vma={hex(load_addr)}", str(path)],
                  check=True, capture_output=True, text=True
              )
              lines = proc.stdout.splitlines()
              by_addr = {}
              for i, line in enumerate(lines):
                  m = re.match(r"^\s*([0-9a-fA-F]+):", line)
                  if m:
                      by_addr[int(m.group(1), 16)] = i

              refs = []
              for off in range(0, len(segment) - 1, 2):
                  op = struct.unpack_from("<H", segment, off)[0]
                  if (op & 0xF000) == 0xD000:
                      pc = load_addr + off
                      target = ((pc + 4) & ~3) + (op & 0xFF) * 4
                      if target in [load_addr + x for x in literals]:
                          refs.append((pc, target, op))

              print(f"\n=== {label.upper()} SEGMENT (SH-4 little-endian) ===")
              print("size:", hex(size), "syscall-vector literal offsets:",
                    [hex(x) for x in literals])
              print("PC-relative references to those literals:",
                    [(hex(pc), hex(target), hex(op)) for pc, target, op in refs])

              printed = set()
              for pc, target, op in refs:
                  idx = by_addr.get(pc)
                  if idx is None:
                      continue
                  lo, hi = max(0, idx - 30), min(len(lines), idx + 70)
                  if (lo, hi) not in printed:
                      printed.add((lo, hi))
                      print(f"\n--- code around {pc:#010x} (literal {target:#010x}) ---")
                      print("\n".join(lines[lo:hi]))

              if entry in by_addr:
                  idx = by_addr[entry]
                  print(f"\n--- entrypoint {entry:#010x} ---")
                  print("\n".join(lines[idx:idx + 100]))

              interesting = []
              for match in re.finditer(rb"[ -~]{5,}", segment):
                  s = match.group().decode("ascii", "replace")
                  if re.search(r"GAME TEST|INPUT TEST|PRESS TEST|RETURN MENU|SERVICE BUTTON|EXIT", s, re.I):
                      interesting.append((load_addr + match.start(), s))
              if interesting:
                  print("\nRelevant strings:")
                  for addr, s in interesting:
                      print(f"{addr:#010x}: {s}")

              return segment

          main_segment = inspect_segment("main", main_off, main_addr, main_size, main_entry)
          test_segment = inspect_segment("test", test_off, test_addr, test_size, test_entry)

          def print_window(label, segment, base, start, end):
              path = pathlib.Path(f"/tmp/{label}-window.bin")
              path.write_bytes(segment)
              dis = subprocess.run(
                  ["sh4-linux-gnu-objdump", "-D", "-b", "binary", "-m", "sh4", "-EL",
                   f"--adjust-vma={hex(base)}", str(path)],
                  check=True, capture_output=True, text=True
              ).stdout.splitlines()
              print(f"\\n=== {label.upper()} DISASSEMBLY {start:#010x}..{end:#010x} ===")
              for line in dis:
                  token = line.strip().split(":", 1)[0]
                  try:
                      address = int(token, 16)
                  except ValueError:
                      continue
                  if start <= address < end:
                      print(line)
              for term in ("8c055624", "8c055633", "8c055862", "ac018044", "ac018040"):
                  matches = [i for i, line in enumerate(dis) if term in line.lower()]
                  if matches:
                      print(f"\\n{label} lines mentioning {term}:")
                      for idx in matches[:20]:
                          print("\\n".join(dis[max(0, idx-4):min(len(dis), idx+5)]))

          print_window("test", test_segment, test_addr, 0x8C0463D0, 0x8C046700)
          print_window("main", main_segment, main_addr, 0x8C063D80, 0x8C064180)

          targets = {
              0x8C046562: "BIOS syscall index 0x10",
              0x8C046582: "BIOS syscall index 0x11 (ENTER_TEST_MODE)",
              0x8C04659A: "BIOS syscall index 0x12",
          }
          callers = []
          for off in range(0, len(test_segment) - 1, 2):
              op = struct.unpack_from("<H", test_segment, off)[0]
              if (op & 0xF000) == 0xB000:
                  disp = op & 0x0FFF
                  if disp & 0x0800:
                      disp -= 0x1000
                  pc = test_addr + off
                  dest = pc + 4 + disp * 2
                  if dest in targets:
                      callers.append((pc, dest, op))
          print("\\n=== DIRECT BSR CALLERS OF BIOS SYSCALL WRAPPERS ===")
          print([(hex(pc), hex(dest), targets[dest], hex(op))
                 for pc, dest, op in callers])

          test_dis = subprocess.run(
              ["sh4-linux-gnu-objdump", "-D", "-b", "binary", "-m", "sh4", "-EL",
               f"--adjust-vma={hex(test_addr)}", "/tmp/test-window.bin"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          addr_to_line = {}
          for i, line in enumerate(test_dis):
              token = line.strip().split(":", 1)[0]
              try:
                  addr_to_line[int(token, 16)] = i
              except ValueError:
                  pass
          for pc, dest, op in callers:
              idx = addr_to_line.get(pc)
              if idx is not None:
                  print(f"\\n--- caller {pc:#010x} -> {dest:#010x} ({targets[dest]}) ---")
                  print("\\n".join(test_dis[max(0, idx-20):min(len(test_dis), idx+30)]))

          for target, label in targets.items():
              needle = struct.pack("<I", target)
              hits = []
              pos = 0
              while True:
                  pos = test_segment.find(needle, pos)
                  if pos < 0:
                      break
                  hits.append(test_addr + pos)
                  pos += 1
              print(f"\\nPointer literals for {label} {target:#010x}:",
                    [hex(x) for x in hits])

          print("\\n=== TEST-SEGMENT REFERENCES TO BIOS TABLE POINTER GLOBAL ===")
          global_needle = struct.pack("<I", 0x8C0A1618)
          global_literals = []
          pos = 0
          while True:
              pos = test_segment.find(global_needle, pos)
              if pos < 0:
                  break
              global_literals.append(pos)
              pos += 1
          global_refs = []
          for off in range(0, len(test_segment) - 1, 2):
              op = struct.unpack_from("<H", test_segment, off)[0]
              if (op & 0xF000) == 0xD000:
                  pc = test_addr + off
                  target = ((pc + 4) & ~3) + (op & 0xFF) * 4
                  if target in [test_addr + x for x in global_literals]:
                      global_refs.append(pc)
          print("global literal RAM locations:", [hex(test_addr+x) for x in global_literals])
          print("PC-relative loads of global pointer:", [hex(x) for x in global_refs])

          test_dis = subprocess.run(
              ["sh4-linux-gnu-objdump", "-D", "-b", "binary", "-m", "sh4", "-EL",
               f"--adjust-vma={hex(test_addr)}", "/tmp/test-window.bin"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          addr_to_line = {}
          for i, line in enumerate(test_dis):
              token = line.strip().split(":", 1)[0]
              try:
                  addr_to_line[int(token, 16)] = i
              except ValueError:
                  pass
          for pc in global_refs:
              idx = addr_to_line.get(pc)
              if idx is not None:
                  print(f"\\n--- global-pointer use at {pc:#010x} ---")
                  print("\\n".join(test_dis[max(0, idx-12):min(len(test_dis), idx+24)]))

          print("\\n=== TEST-SEGMENT PC-RELATIVE REFERENCES INTO MENU STRING AREA ===")
          string_refs = []
          for off in range(0, len(test_segment) - 1, 2):
              op = struct.unpack_from("<H", test_segment, off)[0]
              pc = test_addr + off
              target = None
              if (op & 0xF000) == 0xD000:
                  target = ((pc + 4) & ~3) + (op & 0xFF) * 4
              elif (op & 0xFF00) == 0xC700:
                  target = ((pc + 4) & ~3) + (op & 0xFF) * 4
              elif (op & 0xF000) == 0x9000:
                  target = ((pc + 4) & ~3) + (op & 0xFF) * 2
              if target is not None and 0x8C055000 <= target < 0x8C056000:
                  string_refs.append((pc, target, op))
          print([(hex(pc), hex(target), hex(op)) for pc, target, op in string_refs])
          for pc, target, op in string_refs:
              idx = addr_to_line.get(pc)
              if idx is not None:
                  print(f"\\n--- string-area reference {pc:#010x} -> {target:#010x} ---")
                  print("\\n".join(test_dis[max(0, idx-12):min(len(test_dis), idx+28)]))

          print("\\n=== MENU STRING AREA HEX DUMP ===")
          string_off = 0x8C055500 - test_addr
          print(test_segment[string_off:string_off+0x500].hex(" "))

          print("\\n=== TEST-SEGMENT INDIRECT CALL INSTRUCTIONS ===")
          indirect = []
          for off in range(0, len(test_segment) - 1, 2):
              op = struct.unpack_from("<H", test_segment, off)[0]
              pc = test_addr + off
              if (op & 0xF0FF) == 0x400B:
                  indirect.append((pc, "jsr", (op >> 8) & 15))
              elif (op & 0xF0FF) == 0x402B:
                  indirect.append((pc, "jmp", (op >> 8) & 15))
              elif (op & 0xF0FF) == 0x0003:
                  indirect.append((pc, "bsrf", (op >> 8) & 15))
              elif (op & 0xF0FF) == 0x0023:
                  indirect.append((pc, "braf", (op >> 8) & 15))
          print("count:", len(indirect))
          print("calls/jumps near BIOS wrappers:",
                [(hex(pc), kind, f"r{reg}") for pc, kind, reg in indirect if 0x8C046400 <= pc < 0x8C046700])

          for target, label in targets.items():
              for value in (target, target | 0x20000000, target - test_addr):
                  needle = struct.pack("<I", value & 0xFFFFFFFF)
                  hits = []
                  pos = 0
                  while True:
                      pos = test_segment.find(needle, pos)
                      if pos < 0:
                          break
                      hits.append(test_addr + pos)
                      pos += 1
                  if hits:
                      print(f"Pointer/relative literals for {label} value {value:#010x}:",
                            [hex(x) for x in hits])

          for label, segment, base in (("main", main_segment, main_addr), ("test", test_segment, test_addr)):
              print(f"\\n{label.upper()} ABSOLUTE BIOS VECTOR CONSTANTS:")
              for value in (0xAC018000, 0xAC018040, 0xAC018044, 0xAC018048, 0xAC01804C, 0xAC018050):
                  needle = struct.pack("<I", value)
                  positions = []
                  pos = 0
                  while True:
                      pos = segment.find(needle, pos)
                      if pos < 0:
                          break
                      positions.append(base + pos)
                      pos += 1
                  if positions:
                      print(hex(value), [hex(x) for x in positions])
          PY
