name: VF3 Naomi GD-ROM syscall bridge probe

on:
  push:
    branches: [main]
    paths:
      - "tests/naomi_gdrom_syscall_probe/**"
      - "tests/naomi_fb_probe/**"
      - "tools/pack_vf3_assets.py"
      - "tools/generate_vf3_asset_map_header.py"
      - "tools/append_vf3_assets_to_naomi_rom.py"
      - "tools/build_vf3_netdimm_image.ps1"
      - "docs/THIRD_PARTY_NOTICES.md"
      - "tests/naomi_gdrom_syscall_probe/RETAIL_LOADCHECK_README.md"
      - "tests/naomi_gdrom_syscall_probe/Makefile"
      - "tests/naomi_gdrom_syscall_probe/chainload.S"
      - "tests/naomi_gdrom_syscall_probe/main.c"
      - "tools/generate_vf3_asset_map_from_manifest.py"
      - "docs/GDROM_DISC_FILE_MAP.csv"
      - "tests/test_vf3_asset_packer.py"
      - "tests/test_vf3_asset_map_header.py"
      - "tests/test_append_vf3_assets_to_naomi_rom.py"
      - "tests/test_vf3_asset_map_from_manifest.py"
      - ".github/workflows/naomi-gdrom-syscall-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out VF3 Naomi
        uses: actions/checkout@v4

      - name: Run host-side GD-ROM service contract tests
        run: |
          set -euo pipefail
          gcc -std=c99 -Wall -Wextra -Werror -DVF3_GD_HOST_TEST \
            tests/naomi_gdrom_syscall_probe/gdrom_syscall.c \
            tests/naomi_gdrom_syscall_probe/host_contract_test.c \
            -o /tmp/vf3-gdrom-host-contract
          /tmp/vf3-gdrom-host-contract

      - name: Check out KallistiOS
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: master
          path: kos
          fetch-depth: 1

      - name: Record KOS source revision
        id: kos-revision
        run: echo "sha=$(git -C kos rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install KOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo gettext libjpeg-dev libpng-dev libelf-dev libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev libncurses-dev pkg-config git subversion python3 wget curl

      - name: Restore SH-4 toolchain cache
        id: sh-toolchain
        uses: actions/cache/restore@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Build SH-4 toolchain if cache is empty
        if: steps.sh-toolchain.outputs.cache-hit != 'true'
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          mkdir -p "$KOS_CC_BASE"
          cp "$KOS_BASE/utils/kos-chain/Makefile.dreamcast.cfg" "$KOS_BASE/utils/kos-chain/Makefile.cfg"
          sed -i -e "s|^toolchain_path=.*|toolchain_path=$KOS_CC_BASE|" -e 's|^makejobs=.*|makejobs=4|' -e 's|^enable_objc=.*|enable_objc=0|' -e 's|^enable_objcpp=.*|enable_objcpp=0|' -e 's|^precision_modes=.*|precision_modes=m4-single|' "$KOS_BASE/utils/kos-chain/Makefile.cfg"
          make -C "$KOS_BASE/utils/kos-chain"

      - name: Save SH-4 toolchain cache
        if: steps.sh-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Restore compiled Naomi KOS cache
        id: kos-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: kos-naomi-bootstrap-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-naomi-v2
          restore-keys: kos-naomi-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-

      - name: Overlay cached KOS source and build outputs
        if: steps.kos-cache.outputs.cache-hit == 'true' || steps.kos-cache.outputs.cache-matched-key != ''
        run: tar -xf .cache/kos-naomi-build.tar -C kos

      - name: Configure and build KOS for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kos-ports/include" "$GITHUB_WORKSPACE/kos-ports/lib"
          cat > "$KOS_BASE/environ.sh" <<'EOF'
          export KOS_TOOLCHAIN="gcc"
          export KOS_ARCH="dreamcast"
          export KOS_SUBARCH="naomi"
          export KOS_BASE="${GITHUB_WORKSPACE}/kos"
          export KOS_PORTS="${GITHUB_WORKSPACE}/kos-ports"
          export KOS_CC_BASE="${GITHUB_WORKSPACE}/.toolchain/sh-elf"
          export KOS_CC_PREFIX="sh-elf"
          export DC_ARM_BASE="${GITHUB_WORKSPACE}/.toolchain/arm-eabi"
          export DC_ARM_PREFIX="arm-eabi"
          export DC_TOOLS_BASE="${GITHUB_WORKSPACE}/.toolchain/bin"
          export KOS_GENROMFS="${KOS_BASE}/utils/genromfs/genromfs"
          export KOS_CMAKE_TOOLCHAIN="${KOS_BASE}/utils/cmake/kallistios.toolchain.cmake"
          export KOS_MAKE="make"
          export KOS_CFLAGS="-O2 -fno-PIC -fno-PIE -fomit-frame-pointer"
          export KOS_SH4_PRECISION="-m4-single"
          . "${KOS_BASE}/env/environ_base.sh"
          EOF
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kos/kernel/arch/dreamcast/hardware/maple/mie/mie.c")
          s = p.read_text()
          for function, guard in (("bool mie_init_fw(const char *fw_path) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return false;\n    }\n\n"), ("void mie_init(void) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return;\n    }\n\n")):
              start = s.find(function)
              if start < 0: raise SystemExit(f"Could not find {function}")
              at = s.find(guard, start + len(function))
              if at >= 0: s = s[:at] + s[at + len(guard):]
          p.write_text(s)
          mm = Path("kos/kernel/mm/mm.c")
          ms = mm.read_text()
          heap_check = "if(new_base >= (_arch_mem_top - THD_KERNEL_STACK_SIZE)) {"
          heap_capped = "if(new_base >= (0x8d000000u - THD_KERNEL_STACK_SIZE)) {"
          if heap_check in ms:
              ms = ms.replace(heap_check, heap_capped, 1)
          elif heap_capped not in ms:
              raise SystemExit("Could not safely cap KOS sbrk below resident region")
          mm.write_text(ms)
          print("KOS sbrk heap capped below resident shim at 0x8D000000")
          PY
          make -C "$KOS_BASE" -j2

      - name: Archive compiled Naomi KOS tree
        if: steps.kos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          tar --exclude=.git -cf .cache/kos-naomi-build.tar -C kos .

      - name: Save compiled Naomi KOS cache
        if: steps.kos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: kos-naomi-bootstrap-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-naomi-v2

      - name: Fetch and verify open replacement Dreamcast IP template
        run: |
          set -euo pipefail
          TEMPLATE="tests/naomi_gdrom_syscall_probe/ip_template.bin"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/Dreamcast-Projects/makeip/146b310e2d03c93648f56df81cd27b3458639f5c/rsrc/templates/ip.tmpl" \
            -o "$TEMPLATE"
          test "$(stat -c '%s' "$TEMPLATE")" -eq 32768
          test "$(git hash-object "$TEMPLATE")" = "9ce8f2a7d6cc444ce198ac28ceef223b9848d17a"
          echo "Replacement IP.BIN template: 32768 bytes; pinned Git blob verified."
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path("tests/naomi_gdrom_syscall_probe/ip_template.bin")
          data = source.read_bytes()
          if len(data) != 0x8000:
              raise SystemExit(f"Unexpected IP template size: {len(data)}")
          rows = []
          for i in range(0, len(data), 16):
              rows.append("    " + ", ".join(f"0x{x:02x}" for x in data[i:i+16]) + ",")
          header = "\n".join([
              "#ifndef VF3_IP_TEMPLATE_DATA_H",
              "#define VF3_IP_TEMPLATE_DATA_H",
              "static const uint8_t vf3_ip_template[0x8000] = {",
              *rows,
              "};",
              "#endif",
              ""
          ])
          pathlib.Path("tests/naomi_gdrom_syscall_probe/ip_template_data.h").write_text(header)
          print("Generated C IP template array: 32768 bytes")
          PY

      - name: Compile and package GD-ROM syscall bridge probe
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_gdrom_syscall_probe all
          RESIDENT_ELF="tests/naomi_gdrom_syscall_probe/resident_shim.elf"
          APP_ELF="tests/naomi_gdrom_syscall_probe/vf3_naomi_gdrom_syscall_probe.elf"
          "$KOS_CC_BASE/bin/sh-elf-readelf" -W -l -S "$RESIDENT_ELF" > resident-layout.txt
          "$KOS_CC_BASE/bin/sh-elf-readelf" -W -l -S "$APP_ELF" > app-layout.txt
          "$KOS_CC_BASE/bin/sh-elf-nm" -n "$RESIDENT_ELF" > resident-symbols.txt
          "$KOS_CC_BASE/bin/sh-elf-nm" -u "$RESIDENT_ELF" > resident-undefined.txt
          "$KOS_CC_BASE/bin/sh-elf-nm" -n "$APP_ELF" > app-symbols.txt
          python3 - <<'PY'
          import pathlib
          import re
          resident = pathlib.Path("resident-layout.txt").read_text()
          app = pathlib.Path("app-layout.txt").read_text()
          nm = pathlib.Path("resident-symbols.txt").read_text()
          app_nm = pathlib.Path("app-symbols.txt").read_text()
          undefined = pathlib.Path("resident-undefined.txt").read_text().strip()
          def symbol(table, name):
              for line in table.splitlines():
                  parts = line.split()
                  if len(parts) >= 3 and parts[-1].lstrip("_") == name.lstrip("_"):
                      return int(parts[0], 16)
              raise SystemExit(f"Missing ELF symbol: {name}")
          def section_address(table, name):
              match = re.search(r"\]\s+" + re.escape(name) + r"\s+\S+\s+([0-9a-fA-F]+)", table)
              if not match:
                  raise SystemExit(f"Missing ELF section: {name}\n{table}")
              return int(match.group(1), 16)
          text_addr = section_address(resident, ".vf3_resident_text")
          rodata_addr = section_address(resident, ".vf3_resident_rodata")
          data_addr = section_address(resident, ".vf3_resident_data")
          heap_end = symbol(app_nm, "_end")
          assert text_addr == 0x8d000000, hex(text_addr)
          assert rodata_addr == 0x8d010000, hex(rodata_addr)
          assert data_addr == 0x8d020000, hex(data_addr)
          assert heap_end < 0x8d000000, hex(heap_end)
          assert not undefined, f"Resident object has external dependencies:\n{undefined}"
          assert re.search(r"LOAD\s+\S+\s+0x8d000000\s+0x8d000000", resident, re.I), resident
          app_loads = [line.split() for line in app.splitlines() if line.strip().startswith("LOAD")]
          assert app_loads, app
          assert all(int(row[2], 16) < 0x8d000000 for row in app_loads), app
          image_size = pathlib.Path("tests/naomi_gdrom_syscall_probe/resident_shim.bin").stat().st_size
          assert 0x20000 < image_size <= 0x30000, hex(image_size)
          print(f"Resident text:   0x{text_addr:08X}")
          print(f"Resident rodata: 0x{rodata_addr:08X}")
          print(f"Resident data:   0x{data_addr:08X}")
          print(f"Resident image:  {image_size} bytes; no unresolved references")
          print(f"KOS app _end:    0x{heap_end:08X}; heap capped below resident region")
          print("Resident blob and low-address NAOMI ROM ELF: PASS")
          PY
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_gdrom_syscall_probe rom
                    test -s "tests/naomi_gdrom_syscall_probe/vf3_naomi_gdrom_syscall_probe-v${GITHUB_RUN_NUMBER}.bin"

          # Independent PVR-only display test; no resident bridge or handoff.
          make -C tests/naomi_fb_probe clean
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_fb_probe rom
          test -s "tests/naomi_fb_probe/vf3_naomi_fb_probe-v${GITHUB_RUN_NUMBER}.bin"
          mkdir -p naomi-fb-probe-artifact
          cp "tests/naomi_fb_probe/vf3_naomi_fb_probe-v${GITHUB_RUN_NUMBER}.bin" naomi-fb-probe-artifact/
          cat > naomi-fb-probe-artifact/BUILD_INFO.txt <<EOF
          Target: Standalone Naomi PVR display diagnostic
          Build version: v${GITHUB_RUN_NUMBER}
          Display: direct framebuffer test; solid red-tinted background with white and green blocks
          Dependencies: KOS PVR initialization, then raw PVR framebuffer register writes
          Excludes: resident code, exception vectors, GD-ROM bridge, retail executable
          Purpose: validate the exact direct framebuffer address/mode/stride method used by VF3 diagnostics
          EOF

      - name: Upload standalone Naomi PVR display diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-pvr-display-probe-v${{ github.run_number }}
          path: naomi-fb-probe-artifact/*
          if-no-files-found: error

      - name: Package isolated resident exception renderer probe
        run: |
          set -euo pipefail
          mkdir -p exception-renderer-artifact
          ROM="vf3_naomi_exception_renderer_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" exception-renderer-artifact/
          cat > exception-renderer-artifact/BUILD_INFO.txt <<EOF
          Target: Isolated resident exception display renderer diagnostic
          Build version: v${GITHUB_RUN_NUMBER}
          Display: red background followed by fixed white and green rectangles
          Execution: calls vf3_diag_exception_display directly from normal KOS context
          Includes: the exact resident exception renderer and resident memory image used by VF3
          Excludes: VBR exception dispatch, exception entry assembly, retail executable and GD-ROM asset loading
          Purpose: distinguish resident renderer/section problems from exception-vector or exception-stack problems
          Expected: red background with white upper-left block and green lower block
          EOF

      - name: Upload isolated resident exception renderer probe
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-exception-renderer-probe-v${{ github.run_number }}
          path: exception-renderer-artifact/*
          if-no-files-found: error
      - name: Package isolated exception entry probe
        run: |
          set -euo pipefail
          mkdir -p exception-entry-artifact
          ROM="vf3_naomi_exception_entry_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" exception-entry-artifact/
          cat > exception-entry-artifact/BUILD_INFO.txt <<EOF
          Target: Isolated resident SH-4 exception-entry assembly diagnostic
          Build version: v${GITHUB_RUN_NUMBER}
          Execution: calls _vf3_exception_entry directly from normal KOS context
          Exercises: exception stack switch, SPC/SSR/SGR/EXPEVT/TEA/SR capture, renderer call
          Bypasses: VBR exception dispatch and actual hardware exception generation
          Expected: red background with white upper-left block and green lower block
          Purpose: separate exception-entry assembly/stack faults from VBR vector dispatch faults
          EOF

      - name: Upload isolated exception entry probe
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-exception-entry-probe-v${{ github.run_number }}
          path: exception-entry-artifact/*
          if-no-files-found: error

      - name: Package isolated exception stack probe
        run: |
          set -euo pipefail
          mkdir -p exception-stack-artifact
          ROM="vf3_naomi_exception_stack_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" exception-stack-artifact/
          cat > exception-stack-artifact/BUILD_INFO.txt <<EOF
          Target: Isolated resident SH-4 exception stack-switch diagnostic
          Build version: v${GITHUB_RUN_NUMBER}
          Execution: saves the original KOS stack, switches to a 16-byte-aligned BSS stack, verifies a sentinel, calls a resident C function with an eight-word volatile local array, restores the original stack, and returns the C result to KOS
          Exercises: alternate-stack memory access, resident C stack-frame writes/reads, SH-4 call/return ABI, and caller-stack restoration
          Omits: framebuffer rendering on the alternate stack, SPC/SSR/SGR/EXPEVT/TEA/SR capture, VBR dispatch, hardware exception generation
          Expected PASS: blue background with white upper-left and green lower rectangles; FAIL: red background with white and yellow rectangles
          Purpose: isolate the alternate-stack C call/return path without running the renderer on that stack
          EOF

      - name: Upload isolated exception stack probe
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-exception-stack-probe-v${{ github.run_number }}
          path: exception-stack-artifact/*
          if-no-files-found: error
      - name: Package returning exception register-capture probe
        run: |
          set -euo pipefail
          mkdir -p exception-capture-return-artifact
          ROM="vf3_naomi_exception_capture_return_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" exception-capture-return-artifact/
          cat > exception-capture-return-artifact/BUILD_INFO.txt <<EOF
          Target: Returning SH-4 privileged exception-register capture diagnostic
          Build version: v${GITHUB_RUN_NUMBER}
          Execution: switches to the 16-byte-aligned BSS stack validated by v174, captures SPC/SSR/SGR/EXPEVT/TEA/SR into resident data, calls the resident exception renderer on the validated stack, restores caller stack/r8/PR, and returns a fixed result token
          Omits: VBR dispatch and hardware exception generation
          Expected PASS: blue background with white upper-left and green lower rectangles
          Expected FAIL: red background with white upper-left and yellow lower rectangles
          Purpose: test whether the resident exception renderer returns correctly after privileged-register capture
          EOF

      - name: Upload returning exception register-capture probe
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-exception-capture-return-probe-v${{ github.run_number }}
          path: exception-capture-return-artifact/*
          if-no-files-found: error
      - name: Package alternate-stack resident renderer probe
        run: |
          set -euo pipefail
          mkdir -p stack-renderer-artifact
          ROM="vf3_naomi_exception_stack_renderer_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" stack-renderer-artifact/
          cat > stack-renderer-artifact/BUILD_INFO.txt <<EOF
          Target: Isolated resident exception renderer on alternate stack
          Build version: v${GITHUB_RUN_NUMBER}
          Execution: switches to the 16-byte-aligned KOS BSS stack validated by v174, calls only vf3_diag_exception_draw_once, restores caller stack/r8/PR and returns a fixed token
          Omits: privileged-register capture, VBR dispatch and hardware exception generation
          Expected PASS: blue background with white upper-left and green lower rectangles
          Expected FAIL: red background with white upper-left and yellow lower rectangles
          Purpose: isolate resident renderer execution on alternate stack from register capture
          EOF

      - name: Upload alternate-stack resident renderer probe
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-exception-stack-renderer-probe-v${{ github.run_number }}
          path: stack-renderer-artifact/*
          if-no-files-found: error
      - name: Inspect the retail 1ST_READ.BIN entry sequence
        env:
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y 7zip
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "Mozilla/5.0" \
            "https://www.dropbox.com/scl/fi/axraudzw49jtr8rzat9wc/dc-vf3tb-usa.7z?rlkey=k6uxeattji64870k5z48v93vs&dl=1" \
            --output /tmp/dc-vf3tb-usa.7z
          mkdir -p /tmp/vf3-retail-source
          7z x -y -o/tmp/vf3-retail-source /tmp/dc-vf3tb-usa.7z >/tmp/vf3-7z-extract.log
          RETAIL_BIN="$(find /tmp/vf3-retail-source -type f -iname '1ST_READ.BIN' -print -quit)"
          test -n "$RETAIL_BIN"
          {
            echo "VF3tb USA retail entry analysis"
            echo "File: 1ST_READ.BIN"
            stat -c 'Bytes: %s' "$RETAIL_BIN"
            sha256sum "$RETAIL_BIN"
            echo
            echo "First 128 bytes:"
            od -An -tx1 -N128 "$RETAIL_BIN"
            echo
            echo "SH-4 disassembly at 0x8C010000 (first 100 instructions):"
            "$KOS_CC_BASE/bin/sh-elf-objdump" -D -b binary -m sh4 -EL \
              --adjust-vma=0x8c010000 "$RETAIL_BIN" | sed -n '1,115p'
            echo
            echo "Relocated stage-2 code (file offset 0x100 -> runtime 0x8C004000):"
            dd if="$RETAIL_BIN" of=/tmp/vf3-stage2.bin bs=1 skip=256 count=16128 status=none
            "$KOS_CC_BASE/bin/sh-elf-objdump" -D -b binary -m sh4 -EL \
              --adjust-vma=0x8c004000 /tmp/vf3-stage2.bin | sed -n '1,180p'
          } > retail-entry-analysis.txt
          cat retail-entry-analysis.txt

      - name: Validate and upload GD-ROM syscall bridge ROM
        env:
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          set -euo pipefail
          mkdir -p gdrom-syscall-artifact
          cp retail-entry-analysis.txt gdrom-syscall-artifact/
          ROM="vf3_naomi_gdrom_syscall_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_gdrom_syscall_probe/${ROM}" gdrom-syscall-artifact/
          cp resident-layout.txt gdrom-syscall-artifact/
          cp app-layout.txt gdrom-syscall-artifact/
          cp resident-undefined.txt gdrom-syscall-artifact/
          cp "tests/naomi_gdrom_syscall_probe/resident_shim.bin" gdrom-syscall-artifact/
          "${KOS_CC_BASE}/bin/sh-elf-objdump" -drwC -S tests/naomi_gdrom_syscall_probe/resident_shim.elf > gdrom-syscall-artifact/resident-disassembly.txt
          "${KOS_CC_BASE}/bin/sh-elf-nm" -n tests/naomi_gdrom_syscall_probe/resident_shim.elf > gdrom-syscall-artifact/resident-symbols.txt
          SIZE="$(stat -c '%s' "gdrom-syscall-artifact/${ROM}")"
          SHA="$(sha256sum "gdrom-syscall-artifact/${ROM}" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > gdrom-syscall-artifact/BUILD_INFO.txt <<EOF
          Target: VF3 Dreamcast GD-ROM syscall to NetDIMM DMA bridge probe
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          Workflow run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Syscall vector: 0x8C0000BC
          Commands: DMAREAD 0x11 and PIOREAD 0x10 both serviced by Naomi Holly DMA
          Test mapping: FAD 45150 -> NetDIMM image offset 0
          Resident code/data/map: linked at 0x8D000000 and copied from embedded blob at runtime
          KOS sbrk heap ceiling: below 0x8D000000
          Scope: resident bridge and DMA transport probe only; not the retail game image
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## GD-ROM syscall bridge probe
          - ROM: ${ROM}
          - Size: ${SIZE} bytes
          - SHA-256: ${SHA}
          - BIOS service vector: 0x8C0000BC
          - DMAREAD and PIOREAD both route through Naomi Holly DMA
          EOF
        shell: bash

      - name: Upload GD-ROM syscall bridge Naomi ROM
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-gdrom-syscall-probe-v${{ github.run_number }}
          path: gdrom-syscall-artifact/*
          if-no-files-found: error

      - name: Generate 306 MiB FAD map from the checked-in retail manifest
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_vf3_asset_packer.py' -v
          python3 -m unittest discover -s tests -p 'test_vf3_asset_map_header.py' -v
          python3 -m unittest discover -s tests -p 'test_append_vf3_assets_to_naomi_rom.py' -v
          python3 -m unittest discover -s tests -p 'test_vf3_asset_map_from_manifest.py' -v
          python3 tools/generate_vf3_asset_map_from_manifest.py \
            --manifest docs/GDROM_DISC_FILE_MAP.csv \
            --output vf3-netdimm-306mb-map.json \
            --exclude MOVIE_A.SFD
      - name: Build map-aware VF3 asset smoke-test base ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          BUILD_VERSION="assetmap-v${GITHUB_RUN_NUMBER}"
          ROM="tests/naomi_gdrom_syscall_probe/vf3_naomi_gdrom_syscall_probe-${BUILD_VERSION}.bin"
          # First link fixes table size; derive the exact aligned payload offset.
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-netdimm-306mb-map.json \
            --payload-base 0x02000000 \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          FIRST_SIZE="$(stat -c '%s' "$ROM")"
          PAYLOAD_BASE="$(python3 -c 'import sys; n=int(sys.argv[1]); print((n+2047)//2048*2048)' "$FIRST_SIZE")"
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-netdimm-306mb-map.json \
            --payload-base "$PAYLOAD_BASE" \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          SECOND_SIZE="$(stat -c '%s' "$ROM")"
          test "$FIRST_SIZE" = "$SECOND_SIZE"
          mkdir -p vf3-assetmap-build
          cp "$ROM" vf3-assetmap-build/vf3-naomi-assetmap-base-v${GITHUB_RUN_NUMBER}.bin
          cp tests/naomi_gdrom_syscall_probe/vf3_asset_map.h vf3-assetmap-build/
          cp docs/GDROM_DISC_FILE_MAP.csv vf3-assetmap-build/
          cp vf3-netdimm-306mb-map.json vf3-assetmap-build/
          mkdir -p vf3-assetmap-build/tools
          cp tools/pack_vf3_assets.py tools/append_vf3_assets_to_naomi_rom.py vf3-assetmap-build/tools/
          cp tools/build_vf3_netdimm_image.ps1 vf3-assetmap-build/
          cp tests/naomi_gdrom_syscall_probe/RETAIL_LOADCHECK_README.md vf3-assetmap-build/README.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          d=json.loads(pathlib.Path("vf3-netdimm-306mb-map.json").read_text())
          base=next(pathlib.Path("vf3-assetmap-build").glob("vf3-naomi-assetmap-base-v*.bin"))
          payload_base=int(pathlib.Path("vf3-assetmap-build/vf3_asset_map.h").read_text().split("VF3_ASSET_PAYLOAD_BASE ")[1].split("u")[0])
          expected=payload_base+int(d["payload_bytes"])
          report=[
            "VF3tb USA 306 MiB mapped-asset Naomi smoke-test base ROM",
            f"Manifest assets: {d['source_file_count']}",
            f"Mapped assets: {d['packed_file_count']}",
            f"Raw asset bytes: {d['source_bytes']}",
            f"Sector-aligned payload bytes: {d['payload_bytes']}",
            f"Excluded: {', '.join(d['excluded'])}",
            "MOVIE_B.SFD: included",
            f"Base ROM bytes: {base.stat().st_size}",
            f"Absolute payload base: {payload_base} (0x{payload_base:08X})",
            f"Expected combined image bytes: {expected}",
            f"Expected combined image MiB: {expected/1048576:.2f}",
            f"Base ROM SHA-256: {hashlib.sha256(base.read_bytes()).hexdigest()}",
            "Runtime smoke-test asset: retail 1ST_READ.BIN (FAD 548574)",
            "Runtime DMA load: 576 sectors (1,179,648 bytes) to reserved 0x8D100000 staging RAM",
            "Runtime integrity check: SHA-256 compared with the inspected retail executable",
            "Expected screen on the complete packed payload: RETAIL LOAD PASS / SHA256 MATCH",
            "Map-aware SH-4 bridge build: PASS",
            "Payload bytes are not included in this base-ROM artifact.",
          ]
          assert d["packed_file_count"] == 411
          assert expected <= 512*1024*1024
          assert any(e["name"] == "1ST_READ.BIN" for e in d["entries"])
          assert any(e["name"] == "MOVIE_B.SFD" for e in d["entries"])
          assert "MOVIE_A.SFD" not in [e["name"] for e in d["entries"]]
          pathlib.Path("vf3-assetmap-build/vf3-assetmap-build-report.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Build self-contained synthetic FAD data-integrity ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          BUILD_VERSION="datacheck-v${GITHUB_RUN_NUMBER}"
          ROM="tests/naomi_gdrom_syscall_probe/vf3_naomi_gdrom_syscall_probe-${BUILD_VERSION}.bin"
          python3 - <<'PY'
          import json
          doc = {
              "format": "VF3NAOMI_PACKED_ASSETS_V1",
              "sector_bytes": 2048,
              "fad_bias": 150,
              "excluded": [],
              "source_file_count": 1,
              "packed_file_count": 1,
              "source_bytes": 1179648,
              "payload_bytes": 1179648,
              "entries": [{
                  "name": "1ST_READ.BIN",
                  "fad": 548574,
                  "disc_lba": 548424,
                  "sectors": 576,
                  "size_bytes": 1179648,
                  "sha1": "synthetic-diagnostic-fixture",
                  "payload_offset": 0
              }]
          }
          with open("vf3-datacheck-map.json", "w") as f:
              json.dump(doc, f, indent=2)
          PY
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-datacheck-map.json \
            --payload-base 0x02000000 \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          FIRST_SIZE="$(stat -c '%s' "$ROM")"
          PAYLOAD_BASE="$(python3 -c 'import sys; n=int(sys.argv[1]); print((n+2047)//2048*2048)' "$FIRST_SIZE")"
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-datacheck-map.json \
            --payload-base "$PAYLOAD_BASE" \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          SECOND_SIZE="$(stat -c '%s' "$ROM")"
          test "$FIRST_SIZE" = "$SECOND_SIZE"
          python3 - "$ROM" "$PAYLOAD_BASE" <<'PY'
          import pathlib, sys
          rom = pathlib.Path(sys.argv[1])
          base = int(sys.argv[2])
          size = 576 * 2048
          fixture = bytes(((i * 37 + (i // 2048) * 11 + 0x5a) & 0xff) for i in range(size))
          with rom.open("r+b") as f:
              f.seek(base)
              f.write(fixture)
          assert rom.stat().st_size == base + size
          print(f"Appended {size} deterministic synthetic bytes at 0x{base:08X}")
          PY
          mkdir -p vf3-datacheck-build
          cp "$ROM" vf3-datacheck-build/vf3-naomi-gdrom-datacheck-v${GITHUB_RUN_NUMBER}.bin
          cp tests/naomi_gdrom_syscall_probe/vf3_asset_map.h vf3-datacheck-build/
          python3 - "$ROM" "$PAYLOAD_BASE" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          report=[
              "VF3 NAOMI GD-ROM bridge data-integrity diagnostic",
              "Synthetic deterministic fixture; contains no commercial game assets.",
              "FAD: 548574",
              f"Cartridge payload offset: 0x{int(sys.argv[2]):08X}",
              "Fixture size: 576 sectors (1,179,648 bytes)",
              "Expected DMA chunks: 1 MiB + 128 KiB",
              f"ROM size: {p.stat().st_size}",
              f"ROM SHA-256: {hashlib.sha256(p.read_bytes()).hexdigest()}",
              "Expected: direct PIO / DMA and PIOREAD / DMA comparisons PASS",
          ]
          pathlib.Path("vf3-datacheck-build/BUILD_INFO.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Upload self-contained GD-ROM data-integrity diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-gdrom-datacheck-v${{ github.run_number }}
          path: vf3-datacheck-build/*
          if-no-files-found: error

      - name: Build full-manifest-offset GD-ROM diagnostic ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          BUILD_VERSION="manifestcheck-v${GITHUB_RUN_NUMBER}"
          ROM="tests/naomi_gdrom_syscall_probe/vf3_naomi_gdrom_syscall_probe-${BUILD_VERSION}.bin"
          # Link once to determine the exact sector-aligned payload base.
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-netdimm-306mb-map.json \
            --payload-base 0x02000000 \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          FIRST_SIZE="$(stat -c '%s' "$ROM")"
          PAYLOAD_BASE="$(python3 -c 'import sys; n=int(sys.argv[1]); print((n+2047)//2048*2048)' "$FIRST_SIZE")"
          python3 tools/generate_vf3_asset_map_header.py \
            --map-json vf3-netdimm-306mb-map.json \
            --payload-base "$PAYLOAD_BASE" \
            --output tests/naomi_gdrom_syscall_probe/vf3_asset_map.h
          make -C tests/naomi_gdrom_syscall_probe clean
          BUILD_VERSION="$BUILD_VERSION" make -C tests/naomi_gdrom_syscall_probe rom
          SECOND_SIZE="$(stat -c '%s' "$ROM")"
          test "$FIRST_SIZE" = "$SECOND_SIZE"
          # Publish the compact map-aware base only; keep all retail assets out
          # of public Actions artifacts. This base uses the ROM-end payload
          # offset so it can be combined with the user's own local asset pack.
          mkdir -p vf3-compact-map-base
          cp "$ROM" "vf3-compact-map-base/vf3-naomi-assetmap-base-v${GITHUB_RUN_NUMBER}.bin"
          cp tests/naomi_gdrom_syscall_probe/vf3_asset_map.h vf3-compact-map-base/
          cp vf3-netdimm-306mb-map.json vf3-compact-map-base/
          cp docs/GDROM_DISC_FILE_MAP.csv vf3-compact-map-base/
          mkdir -p vf3-compact-map-base/tools
          cp tools/pack_vf3_assets.py tools/append_vf3_assets_to_naomi_rom.py vf3-compact-map-base/tools/
          cp tools/build_vf3_netdimm_image.ps1 vf3-compact-map-base/
          cp tests/naomi_gdrom_syscall_probe/RETAIL_LOADCHECK_README.md vf3-compact-map-base/README.txt
          cp docs/THIRD_PARTY_NOTICES.md vf3-compact-map-base/THIRD_PARTY_NOTICES.txt
          python3 - "$ROM" "$PAYLOAD_BASE" vf3-netdimm-306mb-map.json <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          rom = pathlib.Path(sys.argv[1])
          base = int(sys.argv[2])
          doc = json.loads(pathlib.Path(sys.argv[3]).read_text())
          asset = next(e for e in doc["entries"] if e["name"].upper() == "1ST_READ.BIN")
          assert asset["fad"] == 548574
          assert asset["sectors"] == 576
          assert asset["payload_offset"] > 0
          fixture_offset = base + int(asset["payload_offset"])
          expected_size = base + int(doc["payload_bytes"])
          assert fixture_offset + 576 * 2048 <= expected_size
          # Make a sparse 306 MiB image with deterministic bytes only at the
          # real 1ST_READ.BIN packed offset. No commercial game data is added.
          with rom.open("r+b") as f:
              f.seek(expected_size - 1)
              f.write(bytes([0]))
              f.seek(fixture_offset)
              fixture = bytes(((i * 37 + (i // 2048) * 11 + 0x5a) & 0xff) for i in range(576 * 2048))
              f.write(fixture)
          assert rom.stat().st_size == expected_size
          out = pathlib.Path("vf3-manifestcheck-build")
          out.mkdir(exist_ok=True)
          target = out / f"vf3-naomi-gdrom-manifestcheck-v{os.environ['GITHUB_RUN_NUMBER']}.bin"
          shutil.copyfile(rom, target)
          with target.open("rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          report = [
              "VF3 NAOMI GD-ROM full-manifest offset diagnostic",
              "Synthetic deterministic fixture; no commercial game assets.",
              f"Manifest assets: {doc['packed_file_count']} mapped / {doc['source_file_count']} source",
              f"Test asset: {asset['name']}",
              f"Test FAD: {asset['fad']}",
              f"Payload-relative offset: 0x{int(asset['payload_offset']):08X}",
              f"Absolute cartridge offset: 0x{fixture_offset:08X}",
              f"Payload base: 0x{base:08X}",
              "Fixture: 576 sectors (1,179,648 bytes)",
              f"Combined sparse image size: {expected_size} bytes ({expected_size/1048576:.2f} MiB)",
              f"ROM SHA-256: {digest}",
              "Expected: direct PIO / DMA and PIOREAD / DMA comparisons PASS",
          ]
          (out / "BUILD_INFO.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Upload compact map-aware base ROM (no game assets)
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-compact-map-base-v${{ github.run_number }}
          path: vf3-compact-map-base/*
          if-no-files-found: error

      - name: Upload full-manifest-offset GD-ROM diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-gdrom-manifestcheck-v${{ github.run_number }}
          path: vf3-manifestcheck-build/*
          if-no-files-found: error

      - name: Upload map-aware bridge build report (metadata only)
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-map-aware-bridge-v${{ github.run_number }}
          path: |
            vf3-assetmap-build/*
            vf3-netdimm-306mb-map.json
          if-no-files-found: error
