name: Inspect retail VF3 attachment handler lists

on:
  push:
    branches: [akira-native-row0-experiment]
    paths:
      - "tools/inspect_retail_handler_lists.py"
      - "tools/inspect_actor_watch_trace.py"
      - "tools/loader_trace_decode.py"
      - ".github/workflows/inspect-retail-handler-lists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Naomi reconstruction
        uses: actions/checkout@v4

      - name: Check out VF3 decomp reference
        uses: actions/checkout@v4
        with:
          repository: celsowm/vf3-decomp
          ref: 8519b155203ba0a222e0a177cb65fb5279824b3e
          path: vf3-decomp
          fetch-depth: 1

      - name: Download existing shared VF3 asset archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "Mozilla/5.0" \
            "https://www.dropbox.com/scl/fo/l47sloq9477lxnotdix35/AFbQ2trl_xczZdgC9fHZgZg?rlkey=uriqyifyb3igd74a31iijz92h&dl=1" \
            --output vf3-assets.zip
          test -s vf3-assets.zip

      - name: Decode the 18 retail handler lists
        run: |
          set -euo pipefail
          python3 tools/inspect_retail_handler_lists.py vf3-assets.zip \
            --readable-status vf3-decomp/docs/readable_status.csv \
            --sh4-tools vf3-decomp/tools \
            | tee HANDLER_LIST_AUDIT.txt
          rm -f vf3-assets.zip

      - name: Recover actor watches from retained v66 through v72 traces
        run: |
          set -euo pipefail
          : > ACTOR_WATCH_REPORT.txt
          for version in 66 68 70 71 72; do
            trace_dir="VF3-Flycast-Trace/VF3-Flycast-Trace-v${version}"
            work="/tmp/vf3-v${version}"
            mkdir -p "$work"
            if [ -f "$trace_dir/vf3-loader-trace-loader.bin" ]; then
              cp "$trace_dir/vf3-loader-trace-loader.bin" "$work/"
            elif [ -f "$trace_dir/vf3-loader-trace-loader.zip" ]; then
              unzip -oq "$trace_dir/vf3-loader-trace-loader.zip" -d "$work"
            else
              echo "v${version}: no retained loader trace" >> ACTOR_WATCH_REPORT.txt
              continue
            fi
            trace="$(find "$work" -type f -name 'vf3-loader-trace-loader.bin' -print -quit)"
            if [ -z "$trace" ]; then
              echo "v${version}: loader trace missing after extraction" >> ACTOR_WATCH_REPORT.txt
              continue
            fi
            if ! python3 tools/loader_trace_decode.py "$trace" --prefix "$work/decoded"; then
              echo "v${version}: trace decoder rejected this format" >> ACTOR_WATCH_REPORT.txt
              continue
            fi
            python3 tools/inspect_actor_watch_trace.py "$work/decoded.memory.csv" \
              --pc-csv "$work/decoded.pc.csv" \
              --version "v${version}" >> ACTOR_WATCH_REPORT.txt
          done

      - name: Upload derived address report only
        uses: actions/upload-artifact@v4
        with:
          name: vf3-retail-attachment-handler-list-audit
          path: |
            HANDLER_LIST_AUDIT.txt
            ACTOR_WATCH_REPORT.txt
          if-no-files-found: error
