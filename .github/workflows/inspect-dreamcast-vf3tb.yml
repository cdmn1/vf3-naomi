name: Inspect retail VF3tb Dreamcast executables

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dreamcast-vf3tb.yml"
      - "tools/inspect_vf3tb_executable.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out VF3 Naomi
        uses: actions/checkout@v4

      - name: Install SH-4 disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-sh4-linux-gnu

      - name: Download the existing shared VF3tb folder
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --user-agent "Mozilla/5.0" \
            "https://www.dropbox.com/scl/fo/l47sloq9477lxnotdix35/AFbQ2trl_xczZdgC9fHZgZg?rlkey=ejwtj15gzidjkyf4d7mhw1ffb&st=kk7fngmr&dl=1" \
            --output vf3-assets.zip
          entry="$(unzip -Z1 vf3-assets.zip | grep -m1 '1ST_READ.BIN')"
          test -n "$entry"
          unzip -p vf3-assets.zip "$entry" > 1ST_READ.BIN
          test "$(stat -c %s 1ST_READ.BIN)" = "1179648"
          echo "Extracted entry: $entry" >> "$GITHUB_STEP_SUMMARY"
          sha256sum 1ST_READ.BIN | tee executable.sha256
          test "$(cut -d' ' -f1 executable.sha256)" = "37f38dd9a47b785f526157c4a1674ca75322f0de1342f64bbf33c88d128e4b32"
          reload_entry="$(unzip -Z1 vf3-assets.zip | grep -m1 'RELOAD.BIN')"
          test -n "$reload_entry"
          unzip -p vf3-assets.zip "$reload_entry" > RELOAD.BIN
          test "$(stat -c %s RELOAD.BIN)" = "655360"
          echo "Extracted second-stage module: $reload_entry" >> "$GITHUB_STEP_SUMMARY"
          sha256sum RELOAD.BIN | tee reload.sha256

      - name: Inspect 1ST_READ and RELOAD SH-4 code
        run: |
          set -euo pipefail
          python3 tools/inspect_vf3tb_executable.py 1ST_READ.BIN
          python3 tools/inspect_vf3tb_executable.py RELOAD.BIN
          cat 1st_read-inspection.txt reload-inspection.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection reports (not copyrighted executables)
        uses: actions/upload-artifact@v4
        with:
          name: vf3tb-dreamcast-executable-inspection-v2
          path: |
            1st_read-inspection.txt
            reload-inspection.txt
            executable.sha256
            reload.sha256
          if-no-files-found: error
