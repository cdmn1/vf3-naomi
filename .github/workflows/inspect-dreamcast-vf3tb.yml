name: Inspect retail VF3tb Dreamcast executables

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dreamcast-vf3tb.yml"
      - "tools/inspect_vf3tb_executable.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out VF3 Naomi
        uses: actions/checkout@v4

      - name: Install 7-Zip and SH-4 disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils-sh4-linux-gnu

      - name: Download and verify the new Dropbox 7z archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --user-agent "Mozilla/5.0" \
            "https://www.dropbox.com/scl/fi/axraudzw49jtr8rzat9wc/dc-vf3tb-usa.7z?rlkey=k6uxeattji64870k5z48v93vs&st=0qedcncl&dl=1" \
            --output dc-vf3tb-usa.7z
          echo "Dropbox response details:"
          file dc-vf3tb-usa.7z
          ls -lh dc-vf3tb-usa.7z
          7z t dc-vf3tb-usa.7z
          7z l -slt dc-vf3tb-usa.7z > archive-listing.txt
          python3 - <<'PY'
          from pathlib import PurePosixPath
          records = []
          current = {}
          for line in open("archive-listing.txt", encoding="utf-8", errors="replace"):
              if not line.strip():
                  if current:
                      records.append(current)
                      current = {}
                  continue
              if " = " in line:
                  key, value = line.rstrip("\\r\\n").split(" = ", 1)
                  current[key] = value
          if current:
              records.append(current)
          def find(name, size):
              for record in records:
                  path = record.get("Path", "")
                  if PurePosixPath(path.replace("\\\\", "/")).name == name and record.get("Size") == str(size):
                      return path
              raise SystemExit(f"Missing {name} with size {size}")
          open("first_read.path", "w").write(find("1ST_READ.BIN", 1179648))
          open("reload.path", "w").write(find("RELOAD.BIN", 655360))
          PY
          entry="$(cat first_read.path)"
          test -n "$entry"
          7z x -so dc-vf3tb-usa.7z "$entry" > 1ST_READ.BIN
          test "$(stat -c %s 1ST_READ.BIN)" = "1179648"
          sha256sum 1ST_READ.BIN | tee executable.sha256
          test "$(cut -d' ' -f1 executable.sha256)" = "37f38dd9a47b785f526157c4a1674ca75322f0de1342f64bbf33c88d128e4b32"
          printf 'Extracted executable: %s\n' "$entry" >> "$GITHUB_STEP_SUMMARY"
          printf 'Archive size: %s bytes\n' "$(stat -c %s dc-vf3tb-usa.7z)" >> "$GITHUB_STEP_SUMMARY"
          printf '1ST_READ.BIN SHA-256: %s\n' "$(cut -d' ' -f1 executable.sha256)" >> "$GITHUB_STEP_SUMMARY"

          reload_entry="$(cat reload.path)"
          test -n "$reload_entry"
          7z x -so dc-vf3tb-usa.7z "$reload_entry" > RELOAD.BIN
          test "$(stat -c %s RELOAD.BIN)" = "655360"
          sha256sum RELOAD.BIN | tee reload.sha256
          printf 'Extracted second-stage module: %s\n' "$reload_entry" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect 1ST_READ and RELOAD SH-4 code
        run: |
          set -euo pipefail
          python3 tools/inspect_vf3tb_executable.py 1ST_READ.BIN
          python3 tools/inspect_vf3tb_executable.py RELOAD.BIN
          cat 1st_read-inspection.txt reload-inspection.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection reports (not copyrighted executables)
        uses: actions/upload-artifact@v4
        with:
          name: vf3tb-dreamcast-executable-inspection-7z-v1
          path: |
            1st_read-inspection.txt
            reload-inspection.txt
            executable.sha256
            reload.sha256
          if-no-files-found: error
