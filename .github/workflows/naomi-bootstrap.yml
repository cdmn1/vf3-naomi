name: VF3 Naomi bootstrap build

on:
  push:
    branches: [main]
    paths:
      - "tests/naomi_bootstrap/**"
      - "tests/naomi_vf3core_smoke/**"
      - "tests/naomi_dma_probe/**"
      - "tests/naomi_vf3_runtime/**"
      - ".github/workflows/naomi-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out VF3 Naomi
        uses: actions/checkout@v4

      - name: Check out KallistiOS
        id: kos
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: master
          path: kos
          fetch-depth: 1

      - name: Record KOS source revision
        id: kos-revision
        run: echo "sha=$(git -C kos rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install KOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo gettext \
            libjpeg-dev libpng-dev libelf-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            zlib1g-dev libncurses-dev pkg-config \
            git subversion python3 wget curl

      - name: Restore SH-4 toolchain cache
        id: sh-toolchain
        uses: actions/cache/restore@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Build SH-4 toolchain if cache is empty
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          mkdir -p "$KOS_CC_BASE"
          if [ ! -x "$KOS_CC_BASE/bin/sh-elf-gcc" ]; then
            cp "$KOS_BASE/utils/kos-chain/Makefile.dreamcast.cfg" \
               "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            sed -i \
              -e "s|^toolchain_path=.*|toolchain_path=$KOS_CC_BASE|" \
              -e 's|^makejobs=.*|makejobs=4|' \
              -e 's|^enable_objc=.*|enable_objc=0|' \
              -e 's|^enable_objcpp=.*|enable_objcpp=0|' \
              -e 's|^precision_modes=.*|precision_modes=m4-single|' \
              "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            make -C "$KOS_BASE/utils/kos-chain"
          fi

      - name: Save SH-4 toolchain cache immediately
        if: steps.sh-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Restore compiled Naomi KOS cache
        id: kos-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: kos-naomi-bootstrap-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-naomi-v2
          restore-keys: |
            kos-naomi-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-

      - name: Overlay cached KOS source and build outputs
        if: steps.kos-cache.outputs.cache-hit == 'true' || steps.kos-cache.outputs.cache-matched-key != ''
        run: tar -xf .cache/kos-naomi-build.tar -C kos

      - name: Configure and build KOS for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kos-ports/include" \
                   "$GITHUB_WORKSPACE/kos-ports/lib"
          cat > "$KOS_BASE/environ.sh" <<'EOF'
          export KOS_TOOLCHAIN="gcc"
          export KOS_ARCH="dreamcast"
          export KOS_SUBARCH="naomi"
          export KOS_BASE="${GITHUB_WORKSPACE}/kos"
          export KOS_PORTS="${GITHUB_WORKSPACE}/kos-ports"
          export KOS_CC_BASE="${GITHUB_WORKSPACE}/.toolchain/sh-elf"
          export KOS_CC_PREFIX="sh-elf"
          export DC_ARM_BASE="${GITHUB_WORKSPACE}/.toolchain/arm-eabi"
          export DC_ARM_PREFIX="arm-eabi"
          export DC_TOOLS_BASE="${GITHUB_WORKSPACE}/.toolchain/bin"
          export KOS_GENROMFS="${KOS_BASE}/utils/genromfs/genromfs"
          export KOS_CMAKE_TOOLCHAIN="${KOS_BASE}/utils/cmake/kallistios.toolchain.cmake"
          export KOS_MAKE="make"
          export KOS_CFLAGS="-O2 -fno-PIC -fno-PIE -fomit-frame-pointer"
          export KOS_SH4_PRECISION="-m4-single"
          . "${KOS_BASE}/env/environ_base.sh"
          EOF
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["KOS_BASE"]) / "kernel/arch/dreamcast/hardware/maple/mie/mie.c"
          s = p.read_text()
          replacements = (
              ("bool mie_init_fw(const char *fw_path) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return false;\n    }\n\n"),
              ("void mie_init(void) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return;\n    }\n\n"),
          )
          for function, guard in replacements:
              start = s.find(function)
              if start < 0:
                  raise SystemExit(f"Could not find {function}")
              guard_at = s.find(guard, start + len(function))
              if guard_at >= 0:
                  s = s[:guard_at] + s[guard_at + len(guard):]
          p.write_text(s)
          PY
          make -C "$KOS_BASE" -j2

      - name: Archive compiled Naomi KOS tree
        if: steps.kos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache
          tar --exclude=.git -cf .cache/kos-naomi-build.tar -C kos .

      - name: Save compiled Naomi KOS cache immediately
        if: steps.kos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: kos-naomi-bootstrap-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-naomi-v2

      - name: Restore bootstrap object cache
        id: object-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tests/naomi_bootstrap/main.o
            tests/naomi_bootstrap/vf3_naomi_bootstrap.elf
          key: vf3-bootstrap-objects-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_bootstrap/main.c', 'tests/naomi_bootstrap/Makefile') }}-sh4-naomi-v1

      - name: Compile Naomi bootstrap ELF
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_bootstrap all
          test -s tests/naomi_bootstrap/vf3_naomi_bootstrap.elf

      - name: Save bootstrap object cache immediately
        if: steps.object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tests/naomi_bootstrap/main.o
            tests/naomi_bootstrap/vf3_naomi_bootstrap.elf
          key: vf3-bootstrap-objects-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_bootstrap/main.c', 'tests/naomi_bootstrap/Makefile') }}-sh4-naomi-v1

      - name: Package Naomi ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_bootstrap rom
          test -s "tests/naomi_bootstrap/vf3_naomi_bootstrap-v${GITHUB_RUN_NUMBER}.bin"

      - name: Validate and describe Naomi ROM
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          ROM="vf3_naomi_bootstrap-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_bootstrap/${ROM}" "build-artifacts/${ROM}"
          SIZE="$(stat -c '%s' "build-artifacts/${ROM}")"
          SHA="$(sha256sum "build-artifacts/${ROM}" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > build-artifacts/BUILD_INFO.txt <<EOF
          Target: VF3 Naomi bootstrap (not the game)
          Source commit: ${GITHUB_SHA}
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          Workflow run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Packaging: KallistiOS naomibintool
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Naomi bootstrap artifact
          - Build version: v${GITHUB_RUN_NUMBER}
          - ROM: ${ROM}
          - Size: ${SIZE} bytes
          - SHA-256: ${SHA}
          - KOS commit: ${{ steps.kos-revision.outputs.sha }}
          - Toolchain cache: ${{ steps.sh-toolchain.outputs.cache-hit }}
          - KOS cache exact hit: ${{ steps.kos-cache.outputs.cache-hit }}
          - Object cache hit: ${{ steps.object-cache.outputs.cache-hit }}
          EOF

      - name: Upload Naomi bootstrap ROM
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-bootstrap-v${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error

      # Keep the known-good bootstrap artifact independent of the VF3 source
      # compile below. If the new source fails to compile, the baseline ROM
      # from this run is still available.
      - name: Check out pinned VF3 C reconstruction
        id: vf3-source
        uses: actions/checkout@v4
        with:
          repository: celsowm/vf3-decomp
          ref: 958937aff8b6ddcd40a5dd01ee5d60350d4140f6
          path: vf3-decomp
          fetch-depth: 1

      - name: Record VF3 source revision
        id: vf3-source-revision
        run: echo "sha=$(git -C vf3-decomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore VF3 MT parser object cache
        id: vf3-mt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tests/naomi_vf3core_smoke/main.o
            tests/naomi_vf3core_smoke/mt.o
            tests/naomi_vf3core_smoke/vf3_naomi_mt_parser.elf
          key: vf3-naomi-mt-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ steps.vf3-source-revision.outputs.sha }}-${{ hashFiles('tests/naomi_vf3core_smoke/main.c', 'tests/naomi_vf3core_smoke/Makefile') }}-v1

      - name: Compile real VF3 MT parser for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_DECOMP_DIR: ${{ github.workspace }}/vf3-decomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_vf3core_smoke all
          test -s tests/naomi_vf3core_smoke/vf3_naomi_mt_parser.elf

      - name: Save VF3 MT parser object cache immediately
        if: steps.vf3-mt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tests/naomi_vf3core_smoke/main.o
            tests/naomi_vf3core_smoke/mt.o
            tests/naomi_vf3core_smoke/vf3_naomi_mt_parser.elf
          key: vf3-naomi-mt-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ steps.vf3-source-revision.outputs.sha }}-${{ hashFiles('tests/naomi_vf3core_smoke/main.c', 'tests/naomi_vf3core_smoke/Makefile') }}-v1

      - name: Package VF3 MT parser Naomi ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_DECOMP_DIR: ${{ github.workspace }}/vf3-decomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_vf3core_smoke rom
          test -s "tests/naomi_vf3core_smoke/vf3_naomi_mt_parser-v${GITHUB_RUN_NUMBER}.bin"

      - name: Validate and upload VF3 MT parser ROM
        run: |
          set -euo pipefail
          mkdir -p vf3-mt-artifact
          ROM="vf3_naomi_mt_parser-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_vf3core_smoke/${ROM}" "vf3-mt-artifact/${ROM}"
          SIZE="$(stat -c '%s' "vf3-mt-artifact/${ROM}")"
          SHA="$(sha256sum "vf3-mt-artifact/${ROM}" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > vf3-mt-artifact/BUILD_INFO.txt <<EOF
          Target: VF3 upstream MT parser smoke test
          VF3 source commit: ${{ steps.vf3-source-revision.outputs.sha }}
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          Workflow run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Packaging: KallistiOS naomibintool
          Commercial game data: not included
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## VF3 MT parser on Naomi
          - Upstream source: ${{ steps.vf3-source-revision.outputs.sha }}
          - Build version: v${GITHUB_RUN_NUMBER}
          - ROM: ${ROM}
          - ROM size: ${SIZE} bytes
          - SHA-256: ${SHA}
          - VF3 MT object cache hit: ${{ steps.vf3-mt-cache.outputs.cache-hit }}
          EOF
        shell: bash

      - name: Upload VF3 MT parser Naomi ROM
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-mt-parser-v${{ github.run_number }}
          path: vf3-mt-artifact/*
          if-no-files-found: error

      - name: Restore Naomi DMA probe object cache
        id: naomi-dma-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tests/naomi_dma_probe/main.o
            tests/naomi_dma_probe/vf3_naomi_dma_probe.elf
          key: vf3-naomi-dma-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_dma_probe/main.c', 'tests/naomi_dma_probe/Makefile') }}-sh4-naomi-v1

      - name: Compile Naomi cartridge DMA probe
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_dma_probe all
          test -s tests/naomi_dma_probe/vf3_naomi_dma_probe.elf

      - name: Save Naomi DMA probe object cache immediately
        if: steps.naomi-dma-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tests/naomi_dma_probe/main.o
            tests/naomi_dma_probe/vf3_naomi_dma_probe.elf
          key: vf3-naomi-dma-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_dma_probe/main.c', 'tests/naomi_dma_probe/Makefile') }}-sh4-naomi-v1

      - name: Package Naomi cartridge DMA probe ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_dma_probe rom
          test -s "tests/naomi_dma_probe/vf3_naomi_dma_probe-v${GITHUB_RUN_NUMBER}.bin"

      - name: Validate and upload Naomi cartridge DMA probe
        run: |
          set -euo pipefail
          mkdir -p naomi-dma-artifact
          ROM="vf3_naomi_dma_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_dma_probe/${ROM}" "naomi-dma-artifact/${ROM}"
          SIZE="$(stat -c '%s' "naomi-dma-artifact/${ROM}")"
          SHA="$(sha256sum "naomi-dma-artifact/${ROM}" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > naomi-dma-artifact/BUILD_INFO.txt <<EOF
          Target: Naomi cartridge PIO versus System Bus GD-DMA probe
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          Workflow run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Storage path: Naomi cartridge / NetDIMM image offset zero
          Dreamcast BIOS GD-ROM syscalls: not used
          Commercial game data: not included
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Naomi cartridge / NetDIMM DMA probe
          - Build version: v${GITHUB_RUN_NUMBER}
          - ROM: ${ROM}
          - Size: ${SIZE} bytes
          - SHA-256: ${SHA}
          - Object cache hit: ${{ steps.naomi-dma-cache.outputs.cache-hit }}
          EOF
        shell: bash

      - name: Upload Naomi cartridge DMA probe ROM
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-dma-probe-v${{ github.run_number }}
          path: naomi-dma-artifact/*
          if-no-files-found: error

      - name: Restore MTAKIPAI asset cache
        id: mtakipai-cache
        uses: actions/cache/restore@v4
        with:
          path: mt-asset/MTAKIPAI.BIN
          key: vf3-mt-asset-mtakipai-dropbox-v1

      - name: Download MTAKIPAI.BIN on cache miss
        if: steps.mtakipai-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mt-asset
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "Mozilla/5.0" \
            "https://www.dropbox.com/scl/fi/0zx1fzg08s0edpdz1l4xu/MTAKIPAI.BIN?rlkey=j62dxghwbvkn1kc999an4c5kx&st=t9d392vh&dl=1" \
            --output mt-asset/MTAKIPAI.BIN

      - name: Validate and cache MTAKIPAI.BIN
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' mt-asset/MTAKIPAI.BIN)" -eq 1572408
          echo "57753c0622fa53c10ba70ef5f6eb3d1e3ee47632461ad0b48bbc77958934c554  mt-asset/MTAKIPAI.BIN" | sha256sum --check
      - name: Save MTAKIPAI asset cache
        if: steps.mtakipai-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mt-asset/MTAKIPAI.BIN
          key: vf3-mt-asset-mtakipai-dropbox-v1

      - name: Stage real MT asset for Naomi link
        run: |
          set -euo pipefail
          cp mt-asset/MTAKIPAI.BIN tests/naomi_vf3_runtime/MTAKIPAI.BIN

      - name: Generate C initializer for real MT asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path("tests/naomi_vf3_runtime/MTAKIPAI.BIN").read_bytes()
          out = Path("tests/naomi_vf3_runtime/MTAKIPAI.inc")
          with out.open("w") as f:
              for i in range(0, len(data), 16):
                  f.write(",".join(f"0x{x:02x}" for x in data[i:i+16]) + ",\n")
          print(f"Generated {out}: {len(data)} bytes")
          PY

      - name: Restore VF3 real MT asset probe object cache
        id: vf3-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tests/naomi_vf3_runtime/main.o
            tests/naomi_vf3_runtime/mt_asset.o
            tests/naomi_vf3_runtime/vf3_naomi_mt_asset_probe.elf
          key: vf3-naomi-mt-asset-probe-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_vf3_runtime/main.c', 'tests/naomi_vf3_runtime/Makefile', 'tests/naomi_vf3_runtime/mt_asset.c', 'tests/naomi_vf3_runtime/MTAKIPAI.BIN') }}-v1

      - name: Preserve timestamps for restored MT asset probe objects
        if: steps.vf3-runtime-cache.outputs.cache-hit == 'true'
        run: |
          touch tests/naomi_vf3_runtime/main.o tests/naomi_vf3_runtime/mt_asset.o tests/naomi_vf3_runtime/vf3_naomi_mt_asset_probe.elf

      - name: Compile real VF3 MT asset probe for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_vf3_runtime all
          test -s tests/naomi_vf3_runtime/vf3_naomi_mt_asset_probe.elf

      - name: Save VF3 real MT asset probe object cache
        if: steps.vf3-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tests/naomi_vf3_runtime/main.o
            tests/naomi_vf3_runtime/mt_asset.o
            tests/naomi_vf3_runtime/vf3_naomi_mt_asset_probe.elf
          key: vf3-naomi-mt-asset-probe-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('tests/naomi_vf3_runtime/main.c', 'tests/naomi_vf3_runtime/Makefile', 'tests/naomi_vf3_runtime/mt_asset.c', 'tests/naomi_vf3_runtime/MTAKIPAI.BIN') }}-v1

      - name: Package real VF3 MT asset probe Naomi ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_vf3_runtime rom
          test -s "tests/naomi_vf3_runtime/vf3_naomi_mt_asset_probe-v${GITHUB_RUN_NUMBER}.bin"

      - name: Validate and upload real VF3 MT asset probe
        run: |
          set -euo pipefail
          mkdir -p vf3-mt-asset-probe-artifact
          ROM="vf3_naomi_mt_asset_probe-v${GITHUB_RUN_NUMBER}.bin"
          cp "tests/naomi_vf3_runtime/${ROM}" "vf3-mt-asset-probe-artifact/${ROM}"
          python3 tests/naomi_vf3_runtime/mt_ref_audit.py tests/naomi_vf3_runtime/MTAKIPAI.BIN > vf3-mt-asset-probe-artifact/MT_REFERENCE_AUDIT.txt
          SIZE="$(stat -c '%s' "vf3-mt-asset-probe-artifact/${ROM}")"
          SHA="$(sha256sum "vf3-mt-asset-probe-artifact/${ROM}" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > vf3-mt-asset-probe-artifact/BUILD_INFO.txt <<EOF
          Target: VF3 Naomi real MT asset table probe
          VF3 source commit: ${{ steps.vf3-source-revision.outputs.sha }}
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          Workflow run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Embedded asset: MTAKIPAI.BIN
          Asset size: 1572408
          Asset SHA-256: 57753c0622fa53c10ba70ef5f6eb3d1e3ee47632461ad0b48bbc77958934c554
          Record boundaries: sorted unique file offsets; not slot-order subtraction
          Scope: real MTAKIPAI component validation and cross-record reference audit; playback semantics not yet mapped
          Packaging: KallistiOS naomibintool
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## VF3 Naomi real MT motion-component probe
          - Build version: v${GITHUB_RUN_NUMBER}
          - ROM: ${ROM}
          - Size: ${SIZE} bytes
          - MTAKIPAI SHA-256: 57753c0622fa53c10ba70ef5f6eb3d1e3ee47632461ad0b48bbc77958934c554
          - Asset cache hit: ${{ steps.mtakipai-cache.outputs.cache-hit }}
          - Runtime object cache hit: ${{ steps.vf3-runtime-cache.outputs.cache-hit }}
          EOF
        shell: bash

